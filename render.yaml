services:
  - type: worker
    name: discord-gemini-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    preDeployCommand: npm run register
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_GUILD_ID
        value: ""
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "512"
      - key: GEMINI_THINKING_LEVEL
        value: minimal
      - key: SYSTEM_INSTRUCTION
        value: "You are a helpful Discord assistant. Keep answers concise, clear, and friendly."
